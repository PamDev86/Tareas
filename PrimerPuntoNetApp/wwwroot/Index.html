<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tareas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">    
</head>

<body>

    <!-- PORTADA -->
    <div class="hero">
        <h1>Organiza tu día 🧠</h1>
        <p>Crea y gestiona tus tareas fácilmente</p>

        <button class="btn btn-light btn-lg mt-3" onclick="mostrarApp()">
            Empezar
        </button>
    </div>

    <!-- APP -->
    <div id="app" class="app-section">
        <div class="card-tareas">
            <h3>📋 Mis Tareas</h3>

            <input id="titulo" class="form-control mb-2" placeholder="Nueva tarea">

            <button onclick="crearTarea()" class="btn btn-primary mb-3">
                Agregar
            </button>

            <ul id="lista" class="list-group"></ul>

            &nbsp;
            <div class="text-center">
                <button class="btn btn-primary mt-3" onclick="ocultarApp()">
                    Salir/Regresar
                </button>
            </div>
        </div>
    </div>    
</body>
</html>

<script src="/app.js"></script>
