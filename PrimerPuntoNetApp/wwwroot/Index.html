<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tareas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- BOTON MENU -->
    <button class="btn btn-dark menu-btn" onclick="toggleMenu()">☰</button>

    <!-- MENU LATERAL -->
    <div id="sidebar" class="sidebar">
        <h3 class="mb-4" style="margin-left: 60px;">📋 Menú</h3>
        <button class="btn btn-primary w-100 mb-3" onclick="mostrarSeccion('crear')">Agregar Tarea</button>
        <button class="btn btn-primary w-100 mb-3" onclick="mostrarSeccion('lista')">Lista de Tareas</button>
        <button class="btn btn-primary w-100" onclick="generarPDF()">Generar PDF</button>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido">

        <!-- CREAR -->
        <div id="crear" class="seccion d-none">
            <h2>➕ Nueva tarea</h2>
            <input id="titulo" class="form-control mb-3" placeholder="Escribe una tarea">
            <button onclick="crearTarea()" class="btn btn-primary  mt-3">Guardar</button>

        </div>

        <!-- LISTA -->
        <div id="lista" class="seccion d-none">
            <h2>📋 Lista de tareas</h2>
            <input id="titulo" class="form-control mb-3" placeholder="Escribe una tarea">
            <ul id="listaTareas" class="list-group mt-3"></ul>
        </div>

    </div>

    <!-- Libreria PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
